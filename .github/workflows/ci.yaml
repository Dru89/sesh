name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # -race on Linux only: the detector needs a C toolchain, which the
      # Windows runner does not reliably provide. Summary generation runs a
      # worker pool, so a data race there would otherwise go unnoticed.
      - name: Run tests
        run: go test ./... -v
        if: matrix.os == 'windows-latest'

      - name: Run tests (race detector)
        run: go test ./... -v -race
        if: matrix.os == 'ubuntu-latest'

      - name: Build
        run: go build ./cmd/sesh/

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Unformatted files:"
            gofmt -l .
            echo "Run 'go fmt ./...' to fix."
            exit 1
          fi
